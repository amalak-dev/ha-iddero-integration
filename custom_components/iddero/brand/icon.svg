<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Panel body -->
  <rect x="48" y="32" width="160" height="192" rx="16" ry="16" fill="#1a1a2e"/>
  <rect x="48" y="32" width="160" height="192" rx="16" ry="16" fill="none" stroke="#4a4a6a" stroke-width="4"/>

  <!-- Screen area -->
  <rect x="68" y="52" width="120" height="120" rx="8" ry="8" fill="#16213e"/>

  <!-- Grid lines representing zones/rooms -->
  <line x1="128" y1="52" x2="128" y2="172" stroke="#0f3460" stroke-width="2"/>
  <line x1="68" y1="112" x2="188" y2="112" stroke="#0f3460" stroke-width="2"/>

  <!-- Zone indicators (lit up rooms) -->
  <circle cx="98" cy="82" r="10" fill="#5b8def" opacity="0.9"/>
  <circle cx="158" cy="82" r="10" fill="#5b8def" opacity="0.5"/>
  <circle cx="98" cy="142" r="10" fill="#5b8def" opacity="0.7"/>
  <circle cx="158" cy="142" r="10" fill="#5b8def" opacity="0.3"/>

  <!-- Touch buttons at bottom -->
  <circle cx="104" cy="198" r="8" fill="#2a2a4a" stroke="#5b8def" stroke-width="2"/>
  <circle cx="128" cy="198" r="8" fill="#2a2a4a" stroke="#5b8def" stroke-width="2"/>
  <circle cx="152" cy="198" r="8" fill="#2a2a4a" stroke="#5b8def" stroke-width="2"/>
</svg>
