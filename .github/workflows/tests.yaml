name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root --extras dev
      - name: Lint
        run: poetry run ruff check .
      - name: Test
        run: poetry run pytest
