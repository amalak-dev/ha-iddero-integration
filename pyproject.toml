[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iddero-plugin"
version = "0.1.0"
description = "Home Assistant custom integration for Iddero KNX panels via web UI scraping."
requires-python = ">=3.14.2,<4.0"
dependencies = []

[project.optional-dependencies]
dev = [
  "homeassistant>=2026.4.0,<2026.6.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.323,<0.14.0",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["custom_components", "tests", "tools"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
exclude = ["captures*", "tests*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
